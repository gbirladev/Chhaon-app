name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "api-java/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "api-java/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-java
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: mvn -B test
      - name: Package
        run: mvn -B -DskipTests package
