name: Web Deploy (GitHub Pages)

# Builds the React PWA in web/ and publishes it to GitHub Pages (replaces Netlify).
# The app is hash-routed, so no SPA fallback is needed; real files (home.html, legal/*,
# .well-known/assetlinks.json) are served as-is.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_REPORTS_ENABLED: ${{ vars.VITE_REPORTS_ENABLED }}
      VITE_PRIVACY_ENABLED: ${{ vars.VITE_PRIVACY_ENABLED }}
      VITE_PHONE_LOGIN: ${{ vars.VITE_PHONE_LOGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Post-process dist for GitHub Pages
        run: |
          # Serve dotfolders/underscored files (GH Pages otherwise runs Jekyll which skips them).
          touch dist/.nojekyll
          # Custom domain.
          echo "chhaon.site" > dist/CNAME
          # Digital Asset Links for the Android TWA (Vite doesn't copy the public/.well-known dotfolder).
          mkdir -p dist/.well-known
          cp public/assetlinks.json dist/.well-known/assetlinks.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
