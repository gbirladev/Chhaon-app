# nginx reverse proxy for the WhatsApp gateway dashboard/API (QR scan + management).
# Place at /etc/nginx/conf.d/wa.conf; TLS via: certbot --nginx -d wa.chhaon.site
server {
    listen 80;
    server_name wa.chhaon.site;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # socket.io (QR/status live updates)
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
