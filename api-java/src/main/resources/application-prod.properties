# Production profile (EC2, ap-south-1). All values injected via /etc/chhaon/backend.env by the
# deploy pipeline. No secrets here.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Behind nginx; show real client IPs.
server.forward-headers-strategy=framework
