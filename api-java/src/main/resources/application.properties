# Base config — shared across profiles. Secrets come from env vars (never commit real values).
spring.application.name=chhaon-backend
server.port=${SERVER_PORT:8080}

# --- Datasource (Supabase Postgres) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}

# --- JPA / Hibernate ---
# Hibernate NEVER writes DDL; Flyway owns the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
# The database already holds the live Chhaon schema (ported from Supabase), so baseline onto
# it and apply only NEW migrations (custom-JWT auth tables, future changes) on top.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# --- JWT ---
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:1440}
app.jwt.issuer=chhaon
# Supabase project JWT secret — lets the backend accept the frontend's Supabase login tokens.
app.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
# Public signing keys of the Supabase project (current projects sign login tokens with ES256, no shared secret). Public data, not a secret.
app.supabase.jwks-url=${SUPABASE_JWKS_URL:https://utjgegiioflwnmesmgcv.supabase.co/auth/v1/.well-known/jwks.json}
# Phone-OTP login mints a Supabase-compatible access token signed with SUPABASE_JWT_SECRET so the web app's
# direct Supabase data/storage calls keep working. No refresh tokens yet, so the token is long-lived.
app.supabase.token-expiry-minutes=${SUPABASE_TOKEN_EXPIRY_MINUTES:10080}
app.supabase.token-issuer=${SUPABASE_TOKEN_ISSUER:chhaon}

# --- Phone-OTP login ---
app.otp.code-length=${OTP_CODE_LENGTH:6}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.request-cooldown-seconds=${OTP_REQUEST_COOLDOWN_SECONDS:30}
app.otp.max-requests-per-hour=${OTP_MAX_REQUESTS_PER_HOUR:5}
app.otp.max-failed-attempts=${OTP_MAX_FAILED_ATTEMPTS:5}
# Play/App Store review account: this ONE phone logs in with the fixed code below instead of a sent OTP, and never
# gets a WhatsApp message. Off unless BOTH are set and the code is at least 8 characters (fails closed).
app.otp.review-phone=${OTP_REVIEW_PHONE:}
app.otp.review-code=${OTP_REVIEW_CODE:}

# --- WhatsApp (self-hosted WA-AKG gateway, same box). Blank = dry-run (logs, never fails). ---
app.whatsapp.gateway-url=${WHATSAPP_GATEWAY_URL:}
app.whatsapp.gateway-token=${WHATSAPP_GATEWAY_TOKEN:}
app.whatsapp.sender-session-name=${WHATSAPP_SENDER_SESSION_NAME:Chhaon}
# The WhatsApp number our messages come from (E.164). Public on GET /features so the Today screen can tell the family which
# number to expect. Blank or malformed = not shown (the screen leaves the number out).
app.whatsapp.sender-phone=${WHATSAPP_SENDER_PHONE:}
# Dose reminders and the daily check-in as a WhatsApp POLL (tap an answer). Off unless true; falls back to text by itself.
app.whatsapp.polls-enabled=${WHATSAPP_POLLS_ENABLED:false}
# Outside watcher (Better Stack heartbeat): pinged after every scheduler tick. Blank = off.
chhaon.scheduler.external-heartbeat-url=${BETTERSTACK_HEARTBEAT_URL:}
# HMAC-SHA256 secret of the gateway's webhook (the same value entered in the gateway dashboard). Blank = the
# webhook endpoint refuses every request (503): it fails closed.
app.whatsapp.webhook-secret=${WHATSAPP_WEBHOOK_SECRET:}
# Secret of the Supabase "Send SMS" auth hook (dashboard: Authentication -> Hooks). Lets the backend deliver the login
# one-time code over WhatsApp. Standard-Webhooks value, e.g. "v1,whsec_...". Blank = POST /hooks/supabase-sms refuses
# everything (503): it fails closed.
app.supabase.send-sms-hook-secret=${SUPABASE_SEND_SMS_HOOK_SECRET:}
# Medicine photo in the WhatsApp reminder: read-only download from the private Storage bucket "medicine-photos".
# SUPABASE_URL = https://<project-ref>.supabase.co; SUPABASE_SERVICE_ROLE_KEY = the project's service_role (or sb_secret_) key.
# Either blank = photos off, every reminder is plain text. The key is never logged and never sent to the web app.
app.storage.supabase-url=${SUPABASE_URL:}
app.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# Web addresses allowed to call this API from a browser (comma separated). The live site by default.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://chhaon.site}

# Reminders (the scheduler). Off unless the environment sets CHHAON_SCHEDULER_ENABLED=true (never written in this file on purpose: a test checks that).
# CHHAON_SCHEDULER_ONLY_RECIPIENT limits it to ONE recipient id for the first switch-on; empty or "all" = every family; anything else = nothing runs.
chhaon.scheduler.only-recipient=${CHHAON_SCHEDULER_ONLY_RECIPIENT:}

# Pilot cap (docs/pilot-cap.md). The limits themselves live in the database (pilot_settings). Scheduler sends are spaced by a random
# 3-8 s gap; the waiting line moves every 10 minutes whenever the scheduler runs.
chhaon.whatsapp.pace-min-ms=3000
chhaon.whatsapp.pace-max-ms=8000
chhaon.pilot.admission-interval-ms=600000

# --- Actuator (health check for the deploy pipeline) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
