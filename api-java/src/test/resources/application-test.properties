# Test profile. The tests run against a THROWAWAY Postgres database (see scripts/make-test-db.sh), never the
# shared development database. From inside Docker Maven the host's local Supabase Postgres is
# host.docker.internal:54322; override with TEST_DB_URL / TEST_DB_USER / TEST_DB_PASSWORD.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://host.docker.internal:54322/chhaon_java_test}
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

# The scheduler never runs on its own in tests; tests call SchedulerService.tick(scope) explicitly.
chhaon.scheduler.enabled=false

# WhatsApp: no gateway (dry-run) and a recording sender bean replaces it anyway.
app.whatsapp.gateway-url=
app.whatsapp.gateway-token=
# Medicine photos: never the real Supabase in tests (a fake store bean replaces it anyway).
app.storage.supabase-url=
app.storage.service-role-key=
app.whatsapp.webhook-secret=test-webhook-secret-not-a-real-secret

app.jwt.secret=test-only-jwt-secret-0123456789-abcdefghijklmnop
# Phone-OTP login mints Supabase-compatible tokens signed with this secret; tests also verify them with it.
app.supabase.jwt-secret=test-only-supabase-secret-0123456789-abcdefghijklmnop
app.supabase.jwks-url=
# Short token for the expiry test; OTP codes expire fast so tests don't wait.
app.supabase.token-expiry-minutes=60
