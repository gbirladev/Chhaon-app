# Render blueprint for the Chhaon API (FREE plan to start; see the paid-plan notes below).
# Render dashboard > New > Blueprint > pick this repo. Secrets marked `sync: false` are asked for once during setup.
# Step by step: docs/GO_LIVE.md
services:
  - type: web
    name: chhaon-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free               # sleeps after ~15 min without calls. An outside timer (cron-job.org) calls /cron/tick every minute, which also keeps it awake.
                             # Move to `starter` (about $7 a month) before real families rely on it.
    region: singapore        # closest Render region to India
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false          # the web app address, e.g. https://chhaon.netlify.app (no trailing slash)
      - key: CRON_SECRET
        generateValue: true
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false          # only needed when report reading is switched on

  # PAID PLAN ONLY: Render's own one-minute timer. On the free plan use cron-job.org instead (docs/GO_LIVE.md).
  # To switch: set `plan: starter` above and uncomment this block.
