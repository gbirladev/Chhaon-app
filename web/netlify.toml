# Netlify settings for the Chhaon web app (set "Base directory" to web if the repo root is connected).
# The landing page (/home.html), the privacy pages (/legal/*) and the emergency page keep working because real files win over the fallback below.
[build]
  command = "npm run build"
  publish = "dist"
  # Netlify's free plan has 300 credits a month and every production deploy costs 15. Skip the build (exit 0) when nothing inside
  # this folder changed since the last deploy: pushes that only touch the API, the database, the docs or the tests cost nothing.
  # If the previous deploy is unknown the command fails (non-zero) and the site is built, which is the safe default.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "20"

# Single page app: any other address opens the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Link pages must never be indexed.
[[headers]]
  for = "/e/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
